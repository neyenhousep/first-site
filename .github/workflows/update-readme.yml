name: update README

on: 
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate README
        uses: marko-hologram/metrics-readme@main
        with:
          template_file: README.md.tpl
          output_file: README.md
          wakatime_api_key: ${{ secrets.WAKATIME_API_KEY }}